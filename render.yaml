# Render blueprint — https://render.com → New → Blueprint → pick this repo.
# The QR code then works on ANY network, because the site has a public URL.
services:
  - type: web
    name: promptify
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # --- required: your Atlas cluster, with a named database -------------
      - key: MONGODB_URI
        sync: false # paste: mongodb+srv://USER:PASS@cluster.../promptify

      # --- required: secrets ------------------------------------------------
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false # organizer login password

      # --- public address the QR code encodes ------------------------------
      # Update to your real Render URL (or custom domain) after the first deploy.
      - key: PUBLIC_URL
        value: https://promptify.onrender.com

      # --- safety -----------------------------------------------------------
      - key: LOGIN_HINTS
        value: "false" # never print credentials on a public site
      - key: ADMIN_USERNAME
        value: admin
      - key: EVENT_YEAR
        value: "2026"
      - key: CHALLENGE_MINUTES
        value: "30"
      - key: CHALLENGE_GRACE_MINUTES
        value: "2"
